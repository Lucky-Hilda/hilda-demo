<!doctype html>

  <title>AI虚拟人心理咨询助手</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8fa;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 18px}.wrap{width:min(1080px,100%)}.head{text-align:center;margin-bottom:24px}.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7b7f87;margin-bottom:10px}.title{font-size:clamp(27px,5vw,44px);line-height:1.16;margin:0;font-weight:750;letter-spacing:-.02em}.sub{margin:12px auto 0;color:#6c7078;font-size:15px}.card{background:#fff;border:1px solid #e8e9ec;border-radius:22px;padding:14px;box-shadow:0 18px 55px rgba(20,24,32,.08)}.player{overflow:hidden;border-radius:14px;background:#090a0c;aspect-ratio:16/9}video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.note{text-align:center;margin:16px 4px 2px;color:#8a8e96;font-size:12px;line-height:1.6}@media(max-width:600px){body{padding:22px 12px}.head{margin-bottom:18px}.card{padding:8px;border-radius:16px}.player{border-radius:11px}.sub{font-size:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="eyebrow">Demo Showcase</div>
      <h1 class="title">AI虚拟人心理咨询助手</h1>
      <p class="sub">Virtual Human · AI Conversation Demo</p>
    </header>
    <section class="card">
      <div class="player"><video controls playsinline preload="metadata" src="demo.mp4"></video></div>
      <div class="note">演示视频仅用于项目展示。本页面已设置为不被搜索引擎索引。</div>
    </section>
  </main>
</body>
